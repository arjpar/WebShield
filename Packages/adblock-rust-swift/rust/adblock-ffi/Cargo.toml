[package]
name = "adblock-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "adblock_ffi"
crate-type = ["staticlib"]

[dependencies]
adblock = { path = "../../vendor/adblock-rust", features = ["content-blocking"] }
cxx = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cxx-build = "1.0"
